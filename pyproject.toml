[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thousand-to-one"
version = "0.1.0"
description = "Baseline training harness for commodity-scale LLM efficiency experiments."
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4.0",
]

[tool.setuptools.packages.find]
include = ["thousand_to_one*"]

